<div class="rsvp-wrapper">

  <div class="rsvp-header">

    <span>
      Confirmación de Asistencia
    </span>

    <p class="rsvp-quote">
      "La alegría compartida siempre es más grande."
    </p>
    <p>
      Nos encantará compartir contigo
      este día tan especial.
    </p>

  </div>

  <div class="rsvp-card">

    <form
      [formGroup]="form"
      (ngSubmit)="submit()">

      <input
        type="text"
        formControlName="nombre"
        placeholder="Nombre completo">

      <input
        type="tel"
        formControlName="telefono"
        placeholder="Teléfono">

      <textarea
        formControlName="mensaje"
        placeholder="Mensaje para los novios">
      </textarea>

      <button
        class="submit-btn"
        type="submit"
        [disabled]="loading">

        <span *ngIf="!loading">
          Confirmar asistencia
        </span>

        <span *ngIf="loading">
          Enviando...
        </span>

      </button>

    </form>

    <div
      *ngIf="success"
      class="success">

      ✅ Gracias por confirmar tu asistencia

    </div>

    <div
      *ngIf="error"
      class="error">

      ❌ Ocurrió un error al enviar

    </div>

  </div>

</div>
