<section class="timeline-wrapper">

  <div class="header">

    <span>
      Nuestra Historia
    </span>

    <h2>
      Un Viaje de Amor
    </h2>

  </div>

  <div class="timeline-line"></div>

  <div
    class="timeline-item"
    *ngFor="
      let item of timeline;
      let i = index
    "
    [class.left]="i % 2 === 0"
    [class.right]="i % 2 !== 0">

    <div class="story-card">

      <div class="story-icon">

        ❦

      </div>

      <div class="year">

        {{ item.year }}

      </div>

      <div
        class="story-image"
        *ngIf="item.image">

        <img
          [src]="item.image"
          [alt]="item.title">

      </div>

      <h3>

        {{ item.title }}

      </h3>

      <p>

        {{ item.description }}

      </p>

    </div>

  </div>

</section>
