<div class="luxury-splash">

  <!-- FLORES -->
  <img
    class="floral floral-top"
    src="floral/top-right.png"
    alt="Decoración floral superior">

  <img
    class="floral floral-bottom"
    src="floral/bottom-left.png"
    alt="Decoración floral inferior">

  <!-- SOBRE -->
  <div class="envelope-wrapper">

    <div class="envelope">

      <!-- SOLAPA -->
      <div class="flap"></div>

      <!-- RANURA VISUAL DEL SOBRE -->
      <div class="card-slot"></div>

      <!-- TARJETA -->
      <div class="invitation-card">

        <div class="card-monogram">
          CJ
        </div>

        <h2>
          Cinthia Gisel
          <br>
          &
          <br>
          Jorge Luis
        </h2>

        <div class="card-divider"></div>

        <!-- <p>
          28 de diciembre de 2026
        </p> -->

      </div>

      <!-- PLIEGUE CENTRAL -->
      <div class="envelope-stitch"></div>

      <!-- SELLO -->
      <div
        class="seal"
        (click)="openEnvelope()">

        <div class="seal-metal">

          <div class="seal-shine"></div>

          <div class="seal-ring"></div>

          <div class="seal-emblem">
            ❀CJ
          </div>

        </div>

      </div>

    </div>

  </div>

  <!-- INSTRUCCIÓN -->
  <div class="instruction">
    DA CLICK AL SOBRE PARA ABRIR
  </div>

</div>
