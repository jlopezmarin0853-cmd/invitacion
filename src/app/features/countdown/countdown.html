<section class="countdown-section">
  <div class="countdown-header">

    <span>
      Nuestra Cuenta Regresiva
    </span>

  </div>

  <div class="countdown-wrapper">

    <div class="time-item">

      <div class="time-value">
        {{ countdown.days }}
      </div>

      <div class="time-label">
        Días
      </div>

    </div>

    <div class="separator"></div>

    <div class="time-item">

      <div class="time-value">
        {{ countdown.hours }}
      </div>

      <div class="time-label">
        Horas
      </div>

    </div>

    <div class="separator"></div>

    <div class="time-item">

      <div class="time-value">
        {{ countdown.minutes }}
      </div>

      <div class="time-label">
        Minutos
      </div>

    </div>

    <div class="separator"></div>

    <div class="time-item">

      <div class="time-value">
        {{ countdown.seconds }}
      </div>

      <div class="time-label">
        Segundos
      </div>

    </div>

  </div>

  <div class="countdown-footer">

    Hasta el día que Dios ha preparado para nosotros.

  </div>

</section>
